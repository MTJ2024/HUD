<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenZone420 HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Server Logo/Branding -->
    <div id="server-logo">
        <div class="logo-container">
            <span class="logo-text">GREENZONE420</span>
        </div>
    </div>

    <!-- Player Status Bars -->
    <div id="status-container" class="hidden">
        <!-- Health -->
        <div class="status-bar" id="health-bar">
            <div class="status-icon">LEBEN</div>
            <div class="status-progress">
                <div class="status-fill health-fill" style="width: 100%"></div>
            </div>
            <div class="status-value">100</div>
        </div>

        <!-- Armor -->
        <div class="status-bar" id="armor-bar">
            <div class="status-icon">ARMOR</div>
            <div class="status-progress">
                <div class="status-fill armor-fill" style="width: 0%"></div>
            </div>
            <div class="status-value">0</div>
        </div>

        <!-- Hunger -->
        <div class="status-bar" id="hunger-bar">
            <div class="status-icon">HUNGER</div>
            <div class="status-progress">
                <div class="status-fill hunger-fill" style="width: 100%"></div>
            </div>
            <div class="status-value">100</div>
        </div>

        <!-- Thirst -->
        <div class="status-bar" id="thirst-bar">
            <div class="status-icon">WASSER</div>
            <div class="status-progress">
                <div class="status-fill thirst-fill" style="width: 100%"></div>
            </div>
            <div class="status-value">100</div>
        </div>

        <!-- Stamina -->
        <div class="status-bar" id="stamina-bar">
            <div class="status-icon">ENERGIE</div>
            <div class="status-progress">
                <div class="status-fill stamina-fill" style="width: 100%"></div>
            </div>
            <div class="status-value">100</div>
        </div>
    </div>

    <!-- Vehicle Speedometer -->
    <div id="speedometer" class="hidden">
        <div class="speedo-container">
            <div class="speed-display">
                <div class="speed-value" id="speed-value">0</div>
                <div class="speed-unit" id="speed-unit">KMH</div>
            </div>
            
            <div class="vehicle-type" id="vehicle-type">
                <span id="vehicle-label">FAHRZEUG</span>
            </div>

            <!-- Fuel & Engine Info -->
            <div class="vehicle-info">
                <div class="info-item" id="fuel-info">
                    <span class="info-icon">TANK</span>
                    <span class="info-value" id="fuel-value">100</span>
                    <span class="info-label">%</span>
                </div>
                <div class="info-item" id="engine-info">
                    <span class="info-icon">MOTOR</span>
                    <span class="info-value" id="engine-value">100</span>
                    <span class="info-label">%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Info (ID & Name) -->
    <div id="player-info" class="hidden">
        <div class="player-container">
            <div class="player-id" id="player-id">#000</div>
            <div class="player-name" id="player-name">Player Name</div>
        </div>
    </div>

    <!-- Location & Time Info -->
    <div id="location-info" class="hidden">
        <div class="location-container">
            <div class="time-display" id="time-display">12:00 PM</div>
            <div class="street-name" id="street-name">Main Street</div>
            <div class="zone-name" id="zone-name">Los Santos</div>
        </div>
    </div>

    <!-- Money & Bank Display (Top-Right) -->
    <div id="money-container" class="hidden">
        <div class="money-item">
            <span class="money-icon">💵</span>
            <span class="money-value" id="cash-value">€0</span>
        </div>
        <div class="money-item bank-item">
            <span class="money-icon">🏦</span>
            <span class="money-value" id="bank-value">€0</span>
        </div>
    </div>

    <!-- Job Display (Top-Right) -->
    <div id="job-container" class="hidden">
        <div class="job-info">
            <span class="job-name" id="job-name">Arbeitslos</span>
            <span class="job-grade" id="job-grade"></span>
        </div>
    </div>

    <!-- Weapon Display (Bottom-Right) -->
    <div id="weapon-container" class="hidden">
        <div class="weapon-info">
            <span class="weapon-name" id="weapon-name">WAFFENLOS</span>
            <div class="ammo-display">
                <span class="ammo-value" id="ammo-value">0 / 0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
