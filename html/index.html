<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud-container">
        <!-- Health Bar -->
        <div class="hud-element" id="health-bar" data-element="health">
            <div class="hud-icon">❤️</div>
            <div class="hud-bar">
                <div class="hud-bar-fill" style="width: 100%;"></div>
            </div>
            <div class="hud-value">100</div>
        </div>

        <!-- Armor Bar -->
        <div class="hud-element" id="armor-bar" data-element="armor">
            <div class="hud-icon">🛡️</div>
            <div class="hud-bar">
                <div class="hud-bar-fill armor" style="width: 100%;"></div>
            </div>
            <div class="hud-value">100</div>
        </div>

        <!-- Stamina Bar -->
        <div class="hud-element" id="stamina-bar" data-element="stamina">
            <div class="hud-icon">⚡</div>
            <div class="hud-bar">
                <div class="hud-bar-fill stamina" style="width: 100%;"></div>
            </div>
            <div class="hud-value">100</div>
        </div>

        <!-- Oxygen/Lung Bar -->
        <div class="hud-element" id="oxygen-bar" data-element="oxygen">
            <div class="hud-icon">🫁</div>
            <div class="hud-bar">
                <div class="hud-bar-fill oxygen" style="width: 100%;"></div>
            </div>
            <div class="hud-value">100</div>
        </div>

        <!-- Stress Bar -->
        <div class="hud-element" id="stress-bar" data-element="stress">
            <div class="hud-icon">😰</div>
            <div class="hud-bar">
                <div class="hud-bar-fill stress" style="width: 0%;"></div>
            </div>
            <div class="hud-value">0</div>
        </div>

        <!-- Sprint Energy Bar -->
        <div class="hud-element" id="sprint-bar" data-element="sprint">
            <div class="hud-icon">🏃</div>
            <div class="hud-bar">
                <div class="hud-bar-fill sprint" style="width: 100%;"></div>
            </div>
            <div class="hud-value">100</div>
        </div>

        <!-- Cash Display -->
        <div class="hud-element" id="cash-display" data-element="cash">
            <div class="hud-icon">💵</div>
            <div class="hud-text">$0</div>
        </div>

        <!-- Bank Money Display -->
        <div class="hud-element" id="bank-display" data-element="bank">
            <div class="hud-icon">🏦</div>
            <div class="hud-text">$0</div>
        </div>

        <!-- Server Name Display -->
        <div class="hud-element" id="server-display" data-element="server">
            <div class="hud-icon">🖥️</div>
            <div class="hud-text">Server Name</div>
        </div>

        <!-- Compass Display -->
        <div class="hud-element" id="compass-display" data-element="compass">
            <div class="hud-icon">🧭</div>
            <div class="hud-text">N</div>
        </div>

        <!-- Street Name Display -->
        <div class="hud-element" id="street-display" data-element="street">
            <div class="hud-icon">📍</div>
            <div class="hud-text">Los Santos</div>
        </div>

        <!-- Weapon Display (only visible when weapon is active) -->
        <div class="hud-element hud-weapon" id="weapon-display" data-element="weapon" style="display: none;">
            <div class="hud-icon">🔫</div>
            <div class="weapon-info">
                <div class="weapon-name">Pistol</div>
                <div class="weapon-details">
                    <span class="weapon-id">ID: 453432689</span>
                    <span class="weapon-ammo">15/120</span>
                </div>
            </div>
        </div>

        <!-- Settings Icon - Only visible in edit mode -->
        <div class="settings-icon" id="settings-icon">
            ⚙️
        </div>
    </div>

    <!-- Edit Mode Overlay -->
    <div id="edit-overlay" class="hidden">
        <div class="edit-instructions">
            <h2>HUD Edit-Modus</h2>
            <p>Ziehe die HUD-Elemente an die gewünschte Position</p>
            <button id="save-btn">Speichern & Beenden (F10)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
