
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FiveM Metallic HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Oswald:wght@400;700&display=swap');
      
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: transparent;
        font-family: 'Inter', sans-serif;
        user-select: none;
      }

      .metallic-bg {
        background: linear-gradient(135deg, rgba(45, 45, 50, 0.92) 0%, rgba(20, 20, 25, 0.98) 100%);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 10px 25px -5px rgba(0, 0, 0, 0.6);
      }

      /* FiveM NUI specific: ensure transparency */
      #root {
        background: transparent;
      }

      @keyframes metallic-shine {
        from { transform: translateX(-100%); }
        to { transform: translateX(200%); }
      }

      .shine-effect {
        position: relative;
        overflow: hidden;
      }

      .shine-effect::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-25deg);
        animation: metallic-shine 4s infinite linear;
      }
    </style>
  <script type="importmap">
{

    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

  </body>
</html>
